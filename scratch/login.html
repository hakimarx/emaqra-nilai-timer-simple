  .login-page {
      background-image: url('https://quran-api.lpmqkemenag.id/alquran/aset/dist/img/gedung bqmi.jpeg');

<body class="hold-transition login-page">
  <!-- <img src="https://quran-api.lpmqkemenag.id/alquran/aset/http://quran-api.lpmqkemenag.id" style="width: 200px;"> -->
  <h3 style="color: black;background-color: white;"><strong>API Qur'an Kemenag</strong></h3>
<div class="login-box">
  <h4 style="color:red;background-color: white;"><center></center></h4>
  <div class="card">
    <div class="card-body login-card-body">
      <p class="login-box-msg">Silahkan masuk untuk memulai sesimu</p>
      <form action="https://quran-api.lpmqkemenag.id/alquran/dashboard/cek_login" method="post">
        <div class="input-group mb-3">
          <input type="text" class="form-control" placeholder="Username" name="username">
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-user"></span>
            </div>
          </div>
        </div>
        <div class="input-group mb-3">
          <input type="password" class="form-control" placeholder="Password" name="password">
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-lock"></span>
            </div>
          </div>
        </div>
        <!-- <div class="input-group mb-3">
          <input type="name" class="form-control" placeholder="Id" name="id">
          <div class="input-group-append">
          </div>
        </div> -->
        <div class="row">
          <div class="col-4"></div>
          <div class="col-4">
            <button type="submit" class="btn btn-primary btn-block">Masuk</button>
          </div>
          <div class="col-4">
            <a href="https://quran-api.lpmqkemenag.id/alquran/dashboard/registrasi" class="btn btn-secondary btn-block">Daftar</a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
